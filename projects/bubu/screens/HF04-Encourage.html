<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>HF04-Encourage</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.gi{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.nut{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.nut span.o{width:52px;height:52px;border-radius:26px;background:#1B2420;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(207,242,126,.35)}
</style>
<style>html,body{background:transparent!important;margin:0;overflow:hidden}</style>
</head>
<body>

<div data-device style="position:relative;width:441px;height:900px;box-sizing:border-box;padding:4px 4px;background:transparent">
<span aria-hidden="true" style="position:absolute;left:0;top:178px;width:6px;height:34px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:236px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:312px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;right:0;top:270px;width:6px;height:96px;border-radius:0 3px 3px 0;background:#5E6460"></span>
<div style="position:relative;width:433px;height:892px;box-sizing:border-box;border-radius:72px;padding:20px;background:linear-gradient(145deg,#8A908C 0%,#4A504C 18%,#2A2F2C 50%,#4A504C 82%,#8A908C 100%);box-shadow:0 40px 80px -30px rgba(20,26,23,.55),inset 0 0 0 1.5px rgba(255,255,255,.25)">
<div style="position:absolute;inset:7px;border-radius:66px;background:#050706"></div>
<div style="position:relative;width:393px;height:852px;overflow:hidden;border-radius:55px;background:#7E958B;font-family:'Noto Sans SC',sans-serif;color:#1B2420">
  <img src="../img/encourage.jpg" alt="光点从三处汇向长出新叶的步步" style="position:absolute;inset:0;width:393px;height:852px;object-fit:cover">
  <button class="gi" aria-label="关闭" style="position:absolute;top:59px;left:16px;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#1B2420"><span class="ms" style="font-size:22px">close</span></button>

  <div class="gi" style="position:absolute;left:12px;right:12px;bottom:12px;border-radius:40px 40px 44px 44px;padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
    <div>
      <div style="font-weight:300;font-size:28px;line-height:36px">今天的养分收齐啦</div>
      <div style="font-size:15px;line-height:22px;color:#3B4A43;margin-top:4px">我长出了第 2 片叶子，明天就能见到真正的我</div>
    </div>
    <div style="display:flex;gap:28px">
      <div class="nut"><span class="o"><span class="ms" style="font-size:24px;color:#9DB9E8">bedtime</span></span>睡眠</div>
      <div class="nut"><span class="o"><span class="ms" style="font-size:24px;color:#F2C98A">restaurant</span></span>饮食</div>
      <div class="nut"><span class="o"><span class="ms" style="font-size:24px;color:#CFF27E">directions_walk</span></span>运动</div>
    </div>
    <div style="align-self:stretch;background:rgba(255,255,255,.7);border-radius:20px;padding:12px 14px;text-align:left">
      <div style="font-size:15px;font-weight:500">今天感觉怎么样？</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <span class="ms" style="font-size:24px;color:#3B4A43">sentiment_dissatisfied</span>
        <span style="position:relative;flex:1;height:28px">
          <span style="position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:rgba(27,36,32,.12)"></span>
          <span style="position:absolute;left:0;width:62%;top:12px;height:4px;border-radius:2px;background:#4E6B4F"></span>
          <span style="position:absolute;left:calc(62% - 14px);top:0;width:28px;height:28px;border-radius:14px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2)"></span>
        </span>
        <span class="ms" style="font-size:24px;color:#3B4A43">sentiment_very_satisfied</span>
      </div>
      <div style="font-size:13px;color:#3B4A43;margin-top:6px">还不错 · 滑动时会轻震</div>
    </div>
    <div style="align-self:stretch;display:flex;flex-direction:column;gap:2px">
      <button style="height:54px;border-radius:27px;border:none;background:#1B2420;color:#fff;font-size:17px;font-weight:500;font-family:inherit">收下</button>
      <button style="height:44px;border:none;background:none;color:#1B2420;font-size:15px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px"><span class="ms" style="font-size:20px">ios_share</span>生成今日卡片</button>
    </div>
  </div>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:54px;z-index:20;pointer-events:none">
    <span style="position:absolute;left:0;width:150px;top:19px;text-align:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:#1B2420">9:41</span>
    <span style="position:absolute;left:50%;top:11px;margin-left:-63px;width:126px;height:37px;border-radius:19px;background:#000"></span>
    <span style="position:absolute;right:0;width:150px;top:21px;display:flex;justify-content:center;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#1B2420"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9a3.4 3.4 0 0 1 4.8 0zM2.8 6.3a7.4 7.4 0 0 1 10.4 0l-1.5 1.5a5.3 5.3 0 0 0-7.4 0zM0 3.5a11.4 11.4 0 0 1 16 0l-1.5 1.5a9.3 9.3 0 0 0-13 0z" fill="#1B2420"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#1B2420" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#1B2420"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#1B2420" fill-opacity=".45"/></svg>
    </span>
  </div>
  <span aria-hidden="true" style="position:absolute;left:50%;bottom:8px;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#1B2420;z-index:20"></span>
</div>
</div>
</div>
