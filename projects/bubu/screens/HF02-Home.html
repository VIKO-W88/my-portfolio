<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>HF02-Home</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.gi{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.gl{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.42);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.gd{background:rgba(16,24,20,.46);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.num{font-family:'Outfit',sans-serif;font-weight:200;letter-spacing:-.02em}
</style>
<style>html,body{background:transparent!important;margin:0;overflow:hidden}</style>
</head>
<body>

<div data-device style="position:relative;width:441px;height:900px;box-sizing:border-box;padding:4px 4px;background:transparent">

<span aria-hidden="true" style="position:absolute;left:0;top:236px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:312px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;right:0;top:270px;width:6px;height:96px;border-radius:0 3px 3px 0;background:#5E6460"></span>
<div style="position:relative;width:433px;height:892px;box-sizing:border-box;border-radius:72px;padding:20px;background:linear-gradient(145deg,#8A908C 0%,#4A504C 18%,#2A2F2C 50%,#4A504C 82%,#8A908C 100%);box-shadow:0 40px 80px -30px rgba(20,26,23,.55),inset 0 0 0 1.5px rgba(255,255,255,.25)">
<div style="position:absolute;inset:7px;border-radius:66px;background:#050706"></div>
<div style="position:relative;width:393px;height:852px;overflow:hidden;border-radius:55px;background:#9FB0A9;font-family:'Noto Sans SC',sans-serif;color:#1B2420">
  <img src="../img/home.jpg" alt="晨雾里坐在青苔小岛上的步步" style="position:absolute;inset:0;width:393px;height:852px;object-fit:cover">

  <div style="position:absolute;top:59px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div style="font-size:13px;color:#3B4A43">第 2/3 天 · 10 月 15 日</div>
      <div style="font-weight:300;font-size:34px;line-height:41px">早上好，小满</div>
    </div>
    <button class="gi" aria-label="我的" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#1B2420;margin-top:4px"><span class="ms" style="font-size:24px">person</span></button>
  </div>

  <div class="gi" style="position:absolute;left:26px;top:172px;border-radius:18px 18px 18px 6px;padding:8px 12px;font-size:15px;max-width:180px">今天想多吃点蔬菜</div>

  <div style="position:absolute;left:16px;right:16px;bottom:106px;display:flex;flex-direction:column;gap:8px">

    <span style="font-size:15px;font-weight:500">长叶中</span>
    <span style="flex:1;height:6px;border-radius:3px;background:rgba(27,36,32,.12);position:relative;overflow:hidden"><span style="position:absolute;left:0;top:0;bottom:0;width:66%;border-radius:3px;background:linear-gradient(90deg,#A7CF6A,#CFF27E)"></span></span>
    <span style="font-family:'Outfit',sans-serif;font-size:15px">2/3 天</span>
  </div>

    <div class="gd" style="border-radius:22px;padding:12px 10px 10px;color:#F4F7F5;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="ms" style="font-size:20px;color:#9DB9E8">bedtime</span><span class="ms msf" style="font-size:18px;color:#CFF27E">check_circle</span></div>
      <div class="num" style="font-size:32px;line-height:1.1;margin-top:6px">6.7<small style="font-size:15px">h</small></div>
      <div style="font-size:12px;opacity:.85">睡眠</div>
    </div>
    <div class="gd" style="border-radius:22px;padding:12px 10px 10px;color:#F4F7F5;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="ms" style="font-size:20px;color:#CFF27E">directions_walk</span><span class="ms msf" style="font-size:18px;color:#CFF27E">check_circle</span></div>
      <div class="num" style="font-size:32px;line-height:1.1;margin-top:6px">4.2<small style="font-size:15px">k</small></div>
      <div style="font-size:12px;opacity:.85">步数</div>
    </div>
    <div style="border-radius:22px;padding:12px 10px 10px;border:1.5px dashed rgba(242,201,138,.9);background:rgba(16,24,20,.32);color:#F4F7F5;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="ms" style="font-size:20px;color:#F2C98A">restaurant</span><span style="font-size:11px;color:#F2C98A">待记录</span></div>
      <div class="num" style="font-size:32px;line-height:1.1;margin-top:6px">2<small style="font-size:15px">/3</small></div>
      <div style="font-size:12px;opacity:.85">饮食</div>
    </div>
  </div>

  <div class="gi" style="border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#3B4A43"><span class="ms" style="font-size:18px;color:#4E6B4F">auto_awesome</span>步步发现</div>
    <div style="font-size:15px;line-height:21px">昨晚比平时晚睡 1 小时，深睡少了 20 分钟。午饭后散步 10 分钟会有帮助。</div>
    <div style="display:flex;gap:8px">
      <button style="height:40px;padding:0 16px;border-radius:20px;border:none;background:#1B2420;color:#fff;font-size:15px;font-weight:500;font-family:inherit;display:flex;align-items:center;gap:6px"><span class="ms" style="font-size:20px">mic</span>记午饭</button>
      <button style="height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(27,36,32,.25);background:none;color:#1B2420;font-size:15px;font-family:inherit">问问步步</button>
    </div>
  </div>
  </div>

  <div style="position:absolute;left:16px;right:16px;bottom:30px;display:flex;gap:10px;align-items:center">
    <div class="gi" style="flex:1;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:0 6px">
      <span style="width:88px;height:52px;border-radius:26px;background:#1B2420;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="ms msf" style="font-size:22px">home</span><span style="font-size:10px;font-weight:500">今日</span></span>
      <span style="width:88px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="ms" style="font-size:22px">insights</span><span style="font-size:10px;font-weight:500">摘要</span></span>
      <span style="width:88px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="ms" style="font-size:22px">forum</span><span style="font-size:10px;font-weight:500">伙伴</span></span>
    </div>
    <button class="gi" aria-label="录入，长按语音" style="flex:none;width:64px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center;color:#1B2420"><span class="ms" style="font-size:30px">add</span></button>
  </div>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:54px;z-index:20;pointer-events:none">
    <span style="position:absolute;left:0;width:150px;top:19px;text-align:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:#1B2420">9:41</span>
    <span style="position:absolute;left:50%;top:11px;margin-left:-63px;width:126px;height:37px;border-radius:19px;background:#000"></span>
    <span style="position:absolute;right:0;width:150px;top:21px;display:flex;justify-content:center;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#1B2420"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9a3.4 3.4 0 0 1 4.8 0zM2.8 6.3a7.4 7.4 0 0 1 10.4 0l-1.5 1.5a5.3 5.3 0 0 0-7.4 0zM0 3.5a11.4 11.4 0 0 1 16 0l-1.5 1.5a9.3 9.3 0 0 0-13 0z" fill="#1B2420"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#1B2420" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#1B2420"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#1B2420" fill-opacity=".45"/></svg>
    </span>
  </div>
  <span aria-hidden="true" style="position:absolute;left:50%;bottom:8px;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#1B2420;z-index:20"></span>

</div>
