<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>HF03-Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.gi{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ed{flex:none;height:32px;padding:0 12px;border-radius:16px;border:none;background:rgba(27,36,32,.08);font-size:13px;font-family:inherit;color:#1B2420}
</style>
<style>html,body{background:transparent!important;margin:0;overflow:hidden}</style>
</head>
<body>

<div data-device style="position:relative;width:441px;height:900px;box-sizing:border-box;padding:4px 4px;background:transparent">
<span aria-hidden="true" style="position:absolute;left:0;top:178px;width:6px;height:34px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:236px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:312px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;right:0;top:270px;width:6px;height:96px;border-radius:0 3px 3px 0;background:#5E6460"></span>
<div style="position:relative;width:433px;height:892px;box-sizing:border-box;border-radius:72px;padding:20px;background:linear-gradient(145deg,#8A908C 0%,#4A504C 18%,#2A2F2C 50%,#4A504C 82%,#8A908C 100%);box-shadow:0 40px 80px -30px rgba(20,26,23,.55),inset 0 0 0 1.5px rgba(255,255,255,.25)">
<div style="position:absolute;inset:7px;border-radius:66px;background:#050706"></div>
<div style="position:relative;width:393px;height:852px;overflow:hidden;border-radius:55px;background:#9FB0A9;font-family:'Noto Sans SC',sans-serif;color:#1B2420">
  <img src="../img/home.jpg" alt="" style="position:absolute;inset:0;width:393px;height:852px;object-fit:cover;filter:blur(6px);transform:scale(1.05)">
  <div style="position:absolute;inset:0;background:rgba(16,24,20,.28)"></div>

  <div style="position:absolute;left:0;right:0;top:64px;bottom:0;border-radius:32px 32px 0 0;background:rgba(244,247,245,.86);backdrop-filter:blur(30px) saturate(1.2);-webkit-backdrop-filter:blur(30px) saturate(1.2);padding:8px 16px 34px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box">
    <span style="align-self:center;width:36px;height:5px;border-radius:3px;background:rgba(27,36,32,.2)"></span>
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <button style="height:44px;border:none;background:none;font-size:17px;font-family:inherit;color:#1B2420;padding:0">取消</button>
      <span style="font-size:17px;font-weight:500">记录饮食</span>
      <span style="width:34px"></span>
    </div>
    <div style="display:flex;background:rgba(27,36,32,.07);border-radius:10px;padding:2px">
      <button style="flex:1;height:32px;border-radius:8px;border:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);font-size:13px;font-weight:500;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;color:#1B2420"><span class="ms" style="font-size:18px">mic</span>语音</button>
      <button style="flex:1;height:32px;border:none;background:none;font-size:13px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;color:#3B4A43"><span class="ms" style="font-size:18px">photo_camera</span>拍照</button>
      <button style="flex:1;height:32px;border:none;background:none;font-size:13px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;color:#3B4A43"><span class="ms" style="font-size:18px">edit</span>输入</button>
    </div>
    <div style="align-self:flex-end;max-width:290px;background:#1B2420;color:#F4F7F5;border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:15px;line-height:21px">早上一个包子一杯豆浆，中午牛肉面，晚上想去跑 3 公里</div>
    <div style="display:flex;align-items:center;gap:8px">
      <img src="../img/bubu.png" alt="步步" style="width:32px;height:32px">
      <span style="font-size:13px;color:#3B4A43">步步听懂了，帮你记成 3 条</span>
    </div>
    <div style="background:#fff;border-radius:20px;padding:4px 14px">
      <div class="row"><span class="ico" style="background:rgba(242,201,138,.3);color:#8B5E1F"><span class="ms">bakery_dining</span></span><span style="flex:1"><span style="display:block;font-size:15px;font-weight:500">早餐</span><span style="font-size:13px;color:#3B4A43">包子 · 豆浆</span></span><button class="ed">编辑</button></div>
      <div style="height:1px;background:rgba(27,36,32,.08);margin-left:52px"></div>
      <div class="row"><span class="ico" style="background:rgba(242,201,138,.3);color:#8B5E1F"><span class="ms">ramen_dining</span></span><span style="flex:1"><span style="display:block;font-size:15px;font-weight:500">午餐</span><span style="font-size:13px;color:#3B4A43">牛肉面</span></span><button class="ed">编辑</button></div>
      <div style="height:1px;background:rgba(27,36,32,.08);margin-left:52px"></div>
      <div class="row"><span class="ico" style="background:rgba(207,242,126,.45);color:#3E5A1E"><span class="ms">directions_run</span></span><span style="flex:1"><span style="display:block;font-size:15px;font-weight:500">今晚目标 · 跑步 3 公里</span><span style="font-size:13px;color:#8B5E1F">需要你确认</span></span><button class="ed" style="background:#1B2420;color:#fff">加入</button></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 14px">
      <span style="font-size:15px;font-weight:500">今日均衡度</span>
      <span style="display:flex;gap:3px"><span style="width:18px;height:6px;border-radius:3px;background:#4E6B4F"></span><span style="width:18px;height:6px;border-radius:3px;background:#4E6B4F"></span><span style="width:18px;height:6px;border-radius:3px;background:rgba(27,36,32,.12)"></span><span style="width:18px;height:6px;border-radius:3px;background:rgba(27,36,32,.12)"></span></span>
      <span style="margin-left:auto;font-size:13px;color:#3B4A43">碳水偏多，蔬菜少</span>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="display:flex;gap:3px;align-items:center;height:24px"><span style="width:3px;height:8px;border-radius:2px;background:#4E6B4F"></span><span style="width:3px;height:18px;border-radius:2px;background:#4E6B4F"></span><span style="width:3px;height:12px;border-radius:2px;background:#4E6B4F"></span><span style="width:3px;height:24px;border-radius:2px;background:#4E6B4F"></span><span style="width:3px;height:14px;border-radius:2px;background:#4E6B4F"></span><span style="width:3px;height:20px;border-radius:2px;background:#4E6B4F"></span><span style="width:3px;height:9px;border-radius:2px;background:#4E6B4F"></span></div>
      <button aria-label="按住说话" style="width:76px;height:76px;border-radius:38px;border:none;background:#1B2420;color:#CFF27E;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(207,242,126,.25)"><span class="ms msf" style="font-size:34px">mic</span></button>
      <span style="font-size:13px;color:#3B4A43">按住说话 · 上滑取消</span>
      <button style="align-self:stretch;height:54px;border-radius:27px;border:none;background:#1B2420;color:#fff;font-size:17px;font-weight:500;font-family:inherit;margin-top:4px">保存 3 条记录</button>
    </div>
  </div>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:54px;z-index:20;pointer-events:none">
    <span style="position:absolute;left:0;width:150px;top:19px;text-align:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:#FFFFFF">9:41</span>
    <span style="position:absolute;left:50%;top:11px;margin-left:-63px;width:126px;height:37px;border-radius:19px;background:#000"></span>
    <span style="position:absolute;right:0;width:150px;top:21px;display:flex;justify-content:center;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#FFFFFF"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9a3.4 3.4 0 0 1 4.8 0zM2.8 6.3a7.4 7.4 0 0 1 10.4 0l-1.5 1.5a5.3 5.3 0 0 0-7.4 0zM0 3.5a11.4 11.4 0 0 1 16 0l-1.5 1.5a9.3 9.3 0 0 0-13 0z" fill="#FFFFFF"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#FFFFFF" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#FFFFFF"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#FFFFFF" fill-opacity=".45"/></svg>
    </span>
  </div>
  <span aria-hidden="true" style="position:absolute;left:50%;bottom:8px;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#FFFFFF;z-index:20"></span>
</div>
</div>
</div>
</body>
</html>
