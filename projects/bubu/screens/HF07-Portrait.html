<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>HF07-Portrait</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.gi{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.gd{background:rgba(16,24,20,.46);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.map{position:absolute;height:28px;padding:0 10px;border-radius:14px;display:flex;align-items:center;gap:5px;font-size:12px;color:#1B2420}
.dim{border-radius:22px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:4px;color:#F4F7F5}
.dim .l{display:flex;align-items:center;gap:4px;font-size:12px;opacity:.9}
.dim .s{font-size:17px;font-weight:500}
</style>
<style>html,body{background:transparent!important;margin:0;overflow:hidden}</style>
</head>
<body>

<div data-device style="position:relative;width:441px;height:900px;box-sizing:border-box;padding:4px 4px;background:transparent">
<span aria-hidden="true" style="position:absolute;left:0;top:178px;width:6px;height:34px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:236px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:312px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;right:0;top:270px;width:6px;height:96px;border-radius:0 3px 3px 0;background:#5E6460"></span>
<div style="position:relative;width:433px;height:892px;box-sizing:border-box;border-radius:72px;padding:20px;background:linear-gradient(145deg,#8A908C 0%,#4A504C 18%,#2A2F2C 50%,#4A504C 82%,#8A908C 100%);box-shadow:0 40px 80px -30px rgba(20,26,23,.55),inset 0 0 0 1.5px rgba(255,255,255,.25)">
<div style="position:absolute;inset:7px;border-radius:66px;background:#050706"></div>
<div style="position:relative;width:393px;height:852px;overflow:hidden;border-radius:55px;background:#8EA299;font-family:'Noto Sans SC',sans-serif;color:#1B2420">
  <img src="../img/formed.jpg" alt="成形的步步带着光晕站在青苔小岛上" style="position:absolute;inset:0;width:393px;height:852px;object-fit:cover">

  <div style="position:absolute;top:59px;left:16px;width:130px">
    <div style="font-weight:300;font-size:34px;line-height:41px">摘要</div>
    <div style="font-size:12px;line-height:16px;color:#3B4A43;margin-top:2px">健康画像<br>基于 3 天数据</div>
  </div>
  <button class="gi" aria-label="分享" style="position:absolute;top:63px;right:16px;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#1B2420"><span class="ms" style="font-size:22px">ios_share</span></button>

  <span class="map gi" style="left:16px;top:176px"><span class="ms" style="font-size:16px;color:#4C6FAE">bedtime</span>光晕 = 睡眠</span>
  <span class="map gi" style="right:16px;top:214px"><span class="ms" style="font-size:16px;color:#8B5E1F">restaurant</span>体态 = 饮食</span>
  <span class="map gi" style="left:22px;top:262px"><span class="ms" style="font-size:16px;color:#4E6B4F">directions_walk</span>活力 = 运动</span>

  <div style="position:absolute;left:16px;right:16px;bottom:106px;display:flex;flex-direction:column;gap:8px">
  <div class="gi" style="border-radius:22px;padding:12px 16px">
    <div style="font-size:12px;color:#3B4A43;display:flex;align-items:center;gap:4px"><span class="ms" style="font-size:16px;color:#4E6B4F">auto_awesome</span>步步说</div>
    <div style="font-weight:300;font-size:22px;line-height:28px;white-space:nowrap">睡得少了点，吃动都不错</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
    <div class="dim gd">
      <div class="l"><span class="ms" style="font-size:16px;color:#9DB9E8">bedtime</span>睡眠质量</div>
      <svg width="100%" height="38" viewBox="0 0 90 38" role="img" aria-label="3 天睡眠 6.5、5.8、6.7 小时"><g fill="#9DB9E8"><rect x="8" y="9" width="16" height="29" rx="4" opacity=".6"/><rect x="37" y="14" width="16" height="24" rx="4" opacity=".6"/><rect x="66" y="7" width="16" height="31" rx="4"/></g></svg>
      <div class="s">需要关照</div>
    </div>
    <div class="dim gd">
      <div class="l"><span class="ms" style="font-size:16px;color:#F2C98A">restaurant</span>饮食均衡</div>
      <svg width="100%" height="38" viewBox="0 0 90 38" role="img" aria-label="饮食均衡度 3/5"><circle cx="45" cy="19" r="15" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="5"/><circle cx="45" cy="19" r="15" fill="none" stroke="#F2C98A" stroke-width="5" stroke-linecap="round" stroke-dasharray="56.5 94.2" transform="rotate(-90 45 19)"/><text x="45" y="23" text-anchor="middle" font-family="Outfit" font-size="12" fill="#F4F7F5">3/5</text></svg>
      <div class="s">还不错</div>
    </div>
    <div class="dim gd">
      <div class="l"><span class="ms" style="font-size:16px;color:#CFF27E">directions_walk</span>运动活跃</div>
      <svg width="100%" height="38" viewBox="0 0 90 38" role="img" aria-label="3 天步数逐日上升"><path d="M6 30 C26 28 36 18 50 18 C64 18 72 8 84 6" fill="none" stroke="#CFF27E" stroke-width="2.4" stroke-linecap="round"/><circle cx="84" cy="6" r="3.5" fill="#CFF27E"/></svg>
      <div class="s">很棒</div>
    </div>
  </div>

  <div class="gi" style="border-radius:22px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px">
    <div style="flex:1"><div style="font-size:12px;color:#3B4A43">步步建议先从睡眠开始</div><div style="font-size:15px;font-weight:500">每晚提早 15 分钟放下手机</div></div>
    <button style="height:40px;padding:0 14px;border-radius:20px;border:none;background:#1B2420;color:#fff;font-size:15px;font-weight:500;font-family:inherit">开始 7 天</button>
  </div>
  <div class="gi" style="height:40px;border-radius:20px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px">
    <span style="width:8px;height:8px;border-radius:4px;background:#C9963C"></span>1 条健康提示<span style="margin-left:auto;display:flex;align-items:center;color:#3B4A43">展开<span class="ms" style="font-size:18px">expand_more</span></span>
  </div>
  </div>

  <div style="position:absolute;left:16px;right:16px;bottom:30px;display:flex;gap:10px;align-items:center">
    <div class="gi" style="flex:1;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:0 6px">
      <span style="width:88px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="ms" style="font-size:22px">home</span><span style="font-size:10px;font-weight:500">今日</span></span>
      <span style="width:88px;height:52px;border-radius:26px;background:#1B2420;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="ms msf" style="font-size:22px">insights</span><span style="font-size:10px;font-weight:500">摘要</span></span>
      <span style="width:88px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="ms" style="font-size:22px">forum</span><span style="font-size:10px;font-weight:500">伙伴</span></span>
    </div>
    <button class="gi" aria-label="录入，长按语音" style="flex:none;width:64px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center;color:#1B2420"><span class="ms" style="font-size:30px">add</span></button>
  </div>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:54px;z-index:20;pointer-events:none">
    <span style="position:absolute;left:0;width:150px;top:19px;text-align:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:#1B2420">9:41</span>
    <span style="position:absolute;left:50%;top:11px;margin-left:-63px;width:126px;height:37px;border-radius:19px;background:#000"></span>
    <span style="position:absolute;right:0;width:150px;top:21px;display:flex;justify-content:center;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#1B2420"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9a3.4 3.4 0 0 1 4.8 0zM2.8 6.3a7.4 7.4 0 0 1 10.4 0l-1.5 1.5a5.3 5.3 0 0 0-7.4 0zM0 3.5a11.4 11.4 0 0 1 16 0l-1.5 1.5a9.3 9.3 0 0 0-13 0z" fill="#1B2420"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#1B2420" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#1B2420"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#1B2420" fill-opacity=".45"/></svg>
    </span>
  </div>
  <span aria-hidden="true" style="position:absolute;left:50%;bottom:8px;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#1B2420;z-index:20"></span>
</div>
</div>
</div>
</body>
</html>
