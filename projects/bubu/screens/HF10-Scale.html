<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>HF10-Scale</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.gi{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ed{flex:none;height:32px;padding:0 12px;border-radius:16px;border:none;background:rgba(27,36,32,.08);font-size:13px;font-family:inherit;color:#1B2420}
</style>
<style>html,body{background:transparent!important;margin:0;overflow:hidden}</style>
</head>
<body>

<div data-device style="position:relative;width:441px;height:900px;box-sizing:border-box;padding:4px 4px;background:transparent">
<span aria-hidden="true" style="position:absolute;left:0;top:178px;width:6px;height:34px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:236px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;left:0;top:312px;width:6px;height:62px;border-radius:3px 0 0 3px;background:#5E6460"></span>
<span aria-hidden="true" style="position:absolute;right:0;top:270px;width:6px;height:96px;border-radius:0 3px 3px 0;background:#5E6460"></span>
<div style="position:relative;width:433px;height:892px;box-sizing:border-box;border-radius:72px;padding:20px;background:linear-gradient(145deg,#8A908C 0%,#4A504C 18%,#2A2F2C 50%,#4A504C 82%,#8A908C 100%);box-shadow:0 40px 80px -30px rgba(20,26,23,.55),inset 0 0 0 1.5px rgba(255,255,255,.25)">
<div style="position:absolute;inset:7px;border-radius:66px;background:#050706"></div>
<div style="position:relative;width:393px;height:852px;overflow:hidden;border-radius:55px;background:#9FB0A9;font-family:'Noto Sans SC',sans-serif;color:#1B2420">
  <img src="../img/home.jpg" alt="" style="position:absolute;inset:0;width:393px;height:852px;object-fit:cover;filter:blur(6px);transform:scale(1.05)">
  <div style="position:absolute;inset:0;background:rgba(16,24,20,.28)"></div>

  <div style="position:absolute;left:0;right:0;top:64px;bottom:0;border-radius:32px 32px 0 0;background:rgba(244,247,245,.88);backdrop-filter:blur(30px) saturate(1.2);-webkit-backdrop-filter:blur(30px) saturate(1.2);padding:8px 16px 34px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box">
    <span style="align-self:center;width:36px;height:5px;border-radius:3px;background:rgba(27,36,32,.2)"></span>
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <span style="width:44px"></span>
      <span style="font-size:17px;font-weight:500;display:flex;align-items:center;gap:6px"><span class="ms" style="font-size:20px;color:#4E6B4F">monitor_weight</span>体脂秤 · 刚刚同步</span>
      <button aria-label="关闭" style="width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:#3B4A43;padding:0"><span style="width:30px;height:30px;border-radius:15px;background:rgba(27,36,32,.08);display:flex;align-items:center;justify-content:center"><span class="ms" style="font-size:18px">close</span></span></button>
    </div>
    <div style="display:flex;align-items:flex-end;gap:10px">
      <img src="../img/bubu.png" alt="步步" style="flex:none;width:64px;height:64px">
      <div style="background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:15px;line-height:22px">早上好，小满。最近吃得更均衡，身体轻快了一点。</div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:14px 16px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:15px;font-weight:500">体重 · 7 日趋势</span>
        <span style="height:26px;padding:0 10px;border-radius:13px;background:rgba(27,36,32,.06);display:flex;align-items:center;gap:4px;font-size:12px;color:#3B4A43"><span class="ms" style="font-size:16px">visibility_off</span>数字已隐藏</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><span style="font-family:'Outfit',sans-serif;font-weight:200;font-size:44px;line-height:50px">↓ 0.3</span><span style="font-size:13px;color:#3B4A43">kg · 比 7 天前</span></div>
      <svg width="329" height="96" viewBox="0 0 329 96" role="img" aria-label="7 日体重趋势，平缓下降" style="display:block;margin-top:4px">
        <line x1="0" y1="70" x2="329" y2="70" stroke="rgba(27,36,32,.08)"/>
        <path d="M8 34 C40 30 60 40 92 38 C124 36 146 44 178 46 C210 48 232 44 262 52 C284 57 302 56 318 58" fill="none" stroke="#4E6B4F" stroke-width="2" stroke-linecap="round"/>
        <g fill="#4E6B4F"><circle cx="8" cy="34" r="3"/><circle cx="60" cy="38" r="3"/><circle cx="112" cy="37" r="3"/><circle cx="164" cy="45" r="3"/><circle cx="216" cy="47" r="3"/><circle cx="268" cy="53" r="3"/></g>
        <circle cx="318" cy="58" r="6" fill="#CFF27E" stroke="#1B2420" stroke-width="1.5"/>
        <g font-size="11" fill="#5D6A64" text-anchor="middle" font-family="Noto Sans SC"><text x="8" y="90" text-anchor="start">周四</text><text x="112" y="90">周六</text><text x="216" y="90">周一</text><text x="318" y="90" text-anchor="end">今天</text></g>
      </svg>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div style="background:#fff;border-radius:18px;padding:12px 14px"><div style="font-size:12px;color:#3B4A43">对步步的影响</div><div style="font-size:15px;font-weight:500;margin-top:2px">体态更挺拔一点</div><div style="font-size:12px;color:#4E6B4F;margin-top:2px">饮食维度 +2%</div></div>
      <div style="background:#fff;border-radius:18px;padding:12px 14px"><div style="font-size:12px;color:#3B4A43">来自</div><div style="font-size:15px;font-weight:500;margin-top:2px">家里的体脂秤</div><div style="font-size:12px;color:#3B4A43;margin-top:2px">已识别为 小满</div></div>
    </div>
    <div style="background:#fff;border-radius:16px;padding:0 14px;height:52px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:15px">不显示体重数字</span>
      <span role="switch" aria-checked="true" aria-label="不显示体重数字" style="position:relative;width:51px;height:31px;border-radius:16px;background:#4E6B4F"><span style="position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)"></span></span>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px">
      <button style="height:54px;border-radius:27px;border:none;background:#1B2420;color:#fff;font-size:17px;font-weight:500;font-family:inherit">知道了</button>
      <button style="height:44px;border:none;background:none;color:#1B2420;font-size:15px;font-family:inherit">查看 30 天趋势</button>
    </div>
  </div>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:54px;z-index:20;pointer-events:none">
    <span style="position:absolute;left:0;width:150px;top:19px;text-align:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:#FFFFFF">9:41</span>
    <span style="position:absolute;left:50%;top:11px;margin-left:-63px;width:126px;height:37px;border-radius:19px;background:#000"></span>
    <span style="position:absolute;right:0;width:150px;top:21px;display:flex;justify-content:center;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#FFFFFF"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9a3.4 3.4 0 0 1 4.8 0zM2.8 6.3a7.4 7.4 0 0 1 10.4 0l-1.5 1.5a5.3 5.3 0 0 0-7.4 0zM0 3.5a11.4 11.4 0 0 1 16 0l-1.5 1.5a9.3 9.3 0 0 0-13 0z" fill="#FFFFFF"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#FFFFFF" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#FFFFFF"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#FFFFFF" fill-opacity=".45"/></svg>
    </span>
  </div>
  <span aria-hidden="true" style="position:absolute;left:50%;bottom:8px;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#FFFFFF;z-index:20"></span>
</div>
</div>
</div>
</body>
</html>
